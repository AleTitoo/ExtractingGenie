name: Build Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pyinstaller==6.16.0
          choco install nsis --yes --no-progress
          npm install --ignore-scripts
          node node_modules/electron/install.js
      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Platinum-189-Setup-[0-9]*.exe
            dist/Platinum-189-Setup-[0-9]*.exe.sha256
            dist/Platinum-189-Setup-latest.exe
            dist/Platinum-189-Setup-latest.exe.sha256
            dist/GENIE-Report-Studio-Setup-*.exe
            dist/GENIE-Report-Studio-Setup-*.exe.sha256
